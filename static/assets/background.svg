<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <!-- Deep Midnight Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06030c" />
      <stop offset="45%" stop-color="#120921" />
      <stop offset="80%" stop-color="#1a1230" />
      <stop offset="100%" stop-color="#26173a" />
    </linearGradient>

    <!-- Luminous Moon & Halo -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf2" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#faecc0" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#d6b565" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d6b565" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Amber Lantern Light Radiating from Ticket Booth (X=135, Y=260) -->
    <radialGradient id="boothLanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#f39c12" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#d35400" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#d35400" stop-opacity="0" />
    </radialGradient>

    <!-- Storybook Boardwalk Walkway Gradient -->
    <linearGradient id="walkwayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#322042" />
      <stop offset="15%" stop-color="#271836" />
      <stop offset="60%" stop-color="#1b0f27" />
      <stop offset="100%" stop-color="#100718" />
    </linearGradient>

    <!-- Soft Cloud Tint -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1842" stop-opacity="0" />
      <stop offset="50%" stop-color="#412760" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2a1842" stop-opacity="0" />
    </linearGradient>

    <!-- Edge Vignette Filter -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="900" height="480" fill="url(#skyGrad)" />

  <!-- Moonlit Whispy Clouds in Upper Sky -->
  <path d="M 120 70 Q 240 40 380 65 Q 520 90 640 55 Q 760 30 880 60 L 880 110 Q 720 85 580 105 Q 400 125 240 95 Z" fill="url(#cloudGrad)" />
  <path d="M 0 110 Q 140 85 280 100 Q 440 120 600 90 L 600 135 Q 420 155 260 130 Q 110 115 0 135 Z" fill="url(#cloudGrad)" opacity="0.6" />

  <!-- Pale Glowing Moon -->
  <circle cx="740" cy="80" r="75" fill="url(#moonGlow)" />
  <circle cx="740" cy="80" r="28" fill="#fffef2" />
  <ellipse cx="734" cy="76" rx="8" ry="6" fill="#f4ebd0" opacity="0.45" />

  <!-- Distant Stars & Gentle Twinkles -->
  <g fill="#eadefc">
    <circle cx="80" cy="35" r="1.6" opacity="0.6" />
    <circle cx="180" cy="55" r="1.2" opacity="0.4" />
    <circle cx="260" cy="28" r="1.8" opacity="0.7" />
    <circle cx="340" cy="70" r="1.0" opacity="0.35" />
    <circle cx="430" cy="35" r="1.5" opacity="0.5" />
    <circle cx="510" cy="65" r="1.2" opacity="0.45" />
    <circle cx="610" cy="30" r="1.7" opacity="0.65" />
    <circle cx="840" cy="45" r="1.4" opacity="0.5" />
    <circle cx="875" cy="95" r="1.1" opacity="0.35" />
  </g>

  <!-- Distant Carnival Silhouettes: Big Top Tents & Pavilions -->
  <path d="
    M 0 345
    L 0 280
    Q 70 240 140 285
    Q 210 230 280 290
    L 330 270
    L 410 300
    L 500 275
    Q 560 245 620 285
    L 690 260
    Q 790 235 900 290
    L 900 345 Z
  " fill="#130820" opacity="0.75" />

  <!-- Distant Tent Flags & Spires -->
  <line x1="140" y1="285" x2="140" y2="245" stroke="#25143a" stroke-width="1.8" />
  <polygon points="140,245 152,251 140,257" fill="#682442" opacity="0.8" />
  <line x1="280" y1="290" x2="280" y2="240" stroke="#25143a" stroke-width="1.8" />
  <polygon points="280,240 294,247 280,254" fill="#a47d32" opacity="0.8" />
  <line x1="620" y1="285" x2="620" y2="248" stroke="#25143a" stroke-width="1.8" />
  <polygon points="620,248 632,254 620,260" fill="#205f6b" opacity="0.8" />

  <!-- Moonlit Ferris Wheel Silhouette -->
  <g opacity="0.38" transform="translate(630, 85)">
    <!-- Main Wheel Rings -->
    <circle cx="95" cy="105" r="90" fill="none" stroke="#725096" stroke-width="2.4" />
    <circle cx="95" cy="105" r="76" fill="none" stroke="#725096" stroke-width="1.2" stroke-dasharray="5,4" />
    <circle cx="95" cy="105" r="22" fill="none" stroke="#725096" stroke-width="2" />
    <circle cx="95" cy="105" r="6" fill="#9372be" />
    <!-- Spokes -->
    <line x1="95" y1="15" x2="95" y2="195" stroke="#725096" stroke-width="1.6" />
    <line x1="5" y1="105" x2="185" y2="105" stroke="#725096" stroke-width="1.6" />
    <line x1="31" y1="41" x2="159" y2="169" stroke="#725096" stroke-width="1.6" />
    <line x1="31" y1="169" x2="159" y2="41" stroke="#725096" stroke-width="1.6" />
    <!-- Gondolas -->
    <rect x="90" y="8" width="11" height="13" rx="2" fill="#9372be" />
    <rect x="90" y="190" width="11" height="13" rx="2" fill="#9372be" />
    <rect x="0" y="99" width="11" height="13" rx="2" fill="#9372be" />
    <rect x="180" y="99" width="11" height="13" rx="2" fill="#9372be" />
    <rect x="26" y="35" width="11" height="13" rx="2" fill="#9372be" />
    <rect x="154" y="163" width="11" height="13" rx="2" fill="#9372be" />
    <rect x="26" y="163" width="11" height="13" rx="2" fill="#9372be" />
    <rect x="154" y="35" width="11" height="13" rx="2" fill="#9372be" />
    <!-- Support Legs -->
    <line x1="95" y1="105" x2="42" y2="255" stroke="#523572" stroke-width="3" />
    <line x1="95" y1="105" x2="148" y2="255" stroke="#523572" stroke-width="3" />
  </g>

  <!-- Faded Carnival Bunting Garlands Across Courtyard -->
  <g opacity="0.82">
    <!-- Main Hanging Cords -->
    <path d="M 0 25 Q 225 72 450 30 Q 675 78 900 25" fill="none" stroke="#4a3162" stroke-width="1.6" />
    <!-- Pennant Flags in Weathered Autumn/Carnival Tones -->
    <polygon points="35,33 51,36 43,68" fill="#752c4b" />
    <polygon points="75,41 91,44 83,75" fill="#bd9135" />
    <polygon points="115,48 131,51 123,81" fill="#246a74" />
    <polygon points="155,54 171,57 163,86" fill="#752c4b" />
    <polygon points="198,58 214,59 206,88" fill="#bd9135" />
    <polygon points="242,57 258,56 250,85" fill="#246a74" />
    <polygon points="288,54 304,51 296,80" fill="#752c4b" />
    <polygon points="334,47 350,44 342,73" fill="#bd9135" />
    <polygon points="380,39 396,36 388,65" fill="#246a74" />

    <polygon points="500,37 516,41 508,71" fill="#752c4b" />
    <polygon points="548,46 564,50 556,80" fill="#bd9135" />
    <polygon points="598,54 614,57 606,86" fill="#246a74" />
    <polygon points="650,60 666,61 658,89" fill="#752c4b" />
    <polygon points="702,60 718,59 710,87" fill="#bd9135" />
    <polygon points="754,56 770,53 762,81" fill="#246a74" />
    <polygon points="806,49 822,45 814,74" fill="#752c4b" />
    <polygon points="856,41 872,37 864,66" fill="#bd9135" />
  </g>

  <!-- Warm Amber Lantern Light Puddle Radiating from Ticket Booth (X=135, Y=255) -->
  <ellipse cx="145" cy="275" rx="190" ry="140" fill="url(#boothLanternGlow)" />

  <!-- Foreground Boardwalk Walkway Path (Ground level Y=340 to Y=480) -->
  <rect x="0" y="340" width="900" height="140" fill="url(#walkwayGrad)" />
  <!-- Upper Kerb Edge of Boardwalk with Moonlit Highlight -->
  <line x1="0" y1="340" x2="900" y2="340" stroke="#5a3d72" stroke-width="2.5" />
  <line x1="0" y1="342" x2="900" y2="342" stroke="#2a163a" stroke-width="1.5" />

  <!-- Weathered Wood Boardwalk Planks & Grain Lines -->
  <g stroke="#180c22" stroke-width="1.8" opacity="0.65">
    <line x1="85" y1="340" x2="85" y2="480" />
    <line x1="185" y1="340" x2="185" y2="480" />
    <line x1="290" y1="340" x2="290" y2="480" />
    <line x1="400" y1="340" x2="400" y2="480" />
    <line x1="510" y1="340" x2="510" y2="480" />
    <line x1="625" y1="340" x2="625" y2="480" />
    <line x1="740" y1="340" x2="740" y2="480" />
    <line x1="850" y1="340" x2="850" y2="480" />
  </g>

  <!-- Brass Plank Nails & Wood Grain Detailing -->
  <g fill="#432857" opacity="0.55">
    <circle cx="85" cy="355" r="1.8" /><circle cx="85" cy="460" r="1.8" />
    <circle cx="185" cy="355" r="1.8" /><circle cx="185" cy="460" r="1.8" />
    <circle cx="290" cy="355" r="1.8" /><circle cx="290" cy="460" r="1.8" />
    <circle cx="400" cy="355" r="1.8" /><circle cx="400" cy="460" r="1.8" />
    <circle cx="510" cy="355" r="1.8" /><circle cx="510" cy="460" r="1.8" />
    <circle cx="625" cy="355" r="1.8" /><circle cx="625" cy="460" r="1.8" />
    <circle cx="740" cy="355" r="1.8" /><circle cx="740" cy="460" r="1.8" />
    <circle cx="850" cy="355" r="1.8" /><circle cx="850" cy="460" r="1.8" />
  </g>

  <!-- Atmospheric Storybook Vignette Framing Entire Scene -->
  <rect width="900" height="480" fill="url(#vignette)" pointer-events="none" />
</svg>
