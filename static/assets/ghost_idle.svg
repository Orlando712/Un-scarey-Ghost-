<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <radialGradient id="ghostGlowIdle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#e2f1f8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#b8dce8" stop-opacity="0.4" />
    </radialGradient>
    <filter id="ghostShadowIdle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0a0514" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#ghostShadowIdle)">
    <!-- Sheet Body -->
    <path d="
      M 70 15
      C 38 15, 26 48, 26 84
      C 26 116, 30 138, 33 145
      C 40 138, 48 152, 55 142
      C 62 152, 70 135, 77 145
      C 84 135, 92 152, 99 142
      C 106 152, 112 138, 115 145
      C 117 116, 115 48, 70 15 Z
    " fill="url(#ghostGlowIdle)" />

    <!-- Rosy Cheeks -->
    <ellipse cx="48" cy="84" rx="6" ry="4" fill="#ff8ca3" opacity="0.6" />
    <ellipse cx="92" cy="84" rx="6" ry="4" fill="#ff8ca3" opacity="0.6" />

    <!-- Curious Eyes -->
    <g>
      <ellipse cx="54" cy="70" rx="5" ry="6.5" fill="#140b1c" />
      <ellipse cx="86" cy="70" rx="5" ry="6.5" fill="#140b1c" />
      <circle cx="52" cy="68" r="1.8" fill="#fff" />
      <circle cx="84" cy="68" r="1.8" fill="#fff" />
    </g>

    <!-- Gentle Smile -->
    <path d="M 66 84 Q 70 88 74 84" fill="none" stroke="#140b1c" stroke-width="2.2" stroke-linecap="round" />

    <!-- Cute Cloth Arms -->
    <path d="M 30 88 Q 18 96 28 104" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 110 88 Q 122 96 112 104" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
