<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <radialGradient id="ghostGlowWhisp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#e2f1f8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#b8dce8" stop-opacity="0.4" />
    </radialGradient>
    <filter id="ghostShadowWhisp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0a0514" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#ghostShadowWhisp)">
    <!-- Sheet Body -->
    <path d="
      M 70 15
      C 38 15, 26 48, 26 84
      C 26 116, 30 138, 33 145
      C 40 138, 48 152, 55 142
      C 62 152, 70 135, 77 145
      C 84 135, 92 152, 99 142
      C 106 152, 112 138, 115 145
      C 117 116, 115 48, 70 15 Z
    " fill="url(#ghostGlowWhisp)" />

    <!-- Soft Cheeks -->
    <ellipse cx="48" cy="85" rx="5" ry="3.5" fill="#ff8ca3" opacity="0.6" />
    <ellipse cx="92" cy="85" rx="5" ry="3.5" fill="#ff8ca3" opacity="0.6" />

    <!-- Conspiratorial Tilting Eyes -->
    <g>
      <ellipse cx="54" cy="71" rx="4.5" ry="6" fill="#140b1c" />
      <ellipse cx="86" cy="71" rx="4.5" ry="6" fill="#140b1c" />
      <circle cx="52" cy="69" r="1.6" fill="#fff" />
      <circle cx="84" cy="69" r="1.6" fill="#fff" />
    </g>

    <!-- Small Soft Whisper Mouth -->
    <circle cx="70" cy="86" r="3.2" fill="#140b1c" />

    <!-- One Hand Cupped to Mouth (Whisper gesture) -->
    <path d="M 32 90 Q 50 96 60 90" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 110 88 Q 120 96 112 104" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
