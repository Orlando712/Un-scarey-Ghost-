<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <!-- Weathered Burgundy Planks -->
    <linearGradient id="counterWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#220b14" />
      <stop offset="25%" stop-color="#361423" />
      <stop offset="65%" stop-color="#2a0e1b" />
      <stop offset="100%" stop-color="#1c0710" />
    </linearGradient>

    <!-- Polished Brass Bar with Warm Reflections -->
    <linearGradient id="counterBrassBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6d1c" />
      <stop offset="25%" stop-color="#ffd54f" />
      <stop offset="60%" stop-color="#fff176" />
      <stop offset="80%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6d1c" />
    </linearGradient>
  </defs>

  <!-- Polished Brass Counter Sill / Shelf -->
  <rect x="6" y="2" width="228" height="12" rx="3" fill="url(#counterBrassBar)" stroke="#3a2505" stroke-width="1.6" />
  <line x1="12" y1="5" x2="228" y2="5" stroke="#ffffff" stroke-width="1" opacity="0.6" />

  <!-- SOLID OPAQUE FRONT LOWER COUNTER (Physical Hiding Barrier) -->
  <rect x="10" y="12" width="220" height="136" fill="url(#counterWood)" stroke="#120409" stroke-width="2" />

  <!-- Vertical Timber Plank Grooves -->
  <line x1="50" y1="12" x2="50" y2="148" stroke="#120409" stroke-width="2" />
  <line x1="95" y1="12" x2="95" y2="148" stroke="#120409" stroke-width="2" />
  <line x1="145" y1="12" x2="145" y2="148" stroke="#120409" stroke-width="2" />
  <line x1="190" y1="12" x2="190" y2="148" stroke="#120409" stroke-width="2" />

  <!-- Wood Grain Highlights -->
  <line x1="52" y1="14" x2="52" y2="146" stroke="#4a1c30" stroke-width="1" opacity="0.5" />
  <line x1="97" y1="14" x2="97" y2="146" stroke="#4a1c30" stroke-width="1" opacity="0.5" />
  <line x1="147" y1="14" x2="147" y2="146" stroke="#4a1c30" stroke-width="1" opacity="0.5" />
  <line x1="192" y1="14" x2="192" y2="146" stroke="#4a1c30" stroke-width="1" opacity="0.5" />

  <!-- Horizontal Reinforcement Brace & Brass Carriage Bolts -->
  <rect x="12" y="58" width="216" height="20" fill="#2d101c" stroke="#120409" stroke-width="1.6" />
  <circle cx="32" cy="68" r="3" fill="#d4af37" stroke="#684a0c" stroke-width="1" />
  <circle cx="74" cy="68" r="3" fill="#d4af37" stroke="#684a0c" stroke-width="1" />
  <circle cx="120" cy="68" r="3" fill="#d4af37" stroke="#684a0c" stroke-width="1" />
  <circle cx="166" cy="68" r="3" fill="#d4af37" stroke="#684a0c" stroke-width="1" />
  <circle cx="208" cy="68" r="3" fill="#d4af37" stroke="#684a0c" stroke-width="1" />

  <!-- Lower Base Molding Plinth (Flush with ground) -->
  <rect x="4" y="142" width="232" height="18" rx="2" fill="#16060c" stroke="#0a0205" stroke-width="2" />
  <line x1="8" y1="144" x2="232" y2="144" stroke="#361422" stroke-width="1" />
</svg>
