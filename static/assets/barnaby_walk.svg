<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" width="130" height="150">
  <defs>
    <linearGradient id="tinGradWalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c52" />
      <stop offset="40%" stop-color="#805933" />
      <stop offset="100%" stop-color="#4a3018" />
    </linearGradient>
    <linearGradient id="brassGradWalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c701e" />
    </linearGradient>
  </defs>

  <!-- Winding Key on Back -->
  <g transform="translate(10, 0)">
    <path d="M 88 80 L 105 80" stroke="#d4af37" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="107" cy="74" r="7" fill="none" stroke="#d4af37" stroke-width="2.6" />
    <circle cx="107" cy="86" r="7" fill="none" stroke="#d4af37" stroke-width="2.6" />
  </g>

  <!-- Walking Feet Stride -->
  <ellipse cx="36" cy="136" rx="13" ry="7" fill="url(#brassGradWalk)" stroke="#2b1a0b" stroke-width="1.8" transform="rotate(-10 36 136)" />
  <ellipse cx="84" cy="138" rx="13" ry="7" fill="url(#brassGradWalk)" stroke="#2b1a0b" stroke-width="1.8" transform="rotate(12 84 138)" />

  <!-- Body -->
  <rect x="35" y="65" width="50" height="65" rx="15" fill="url(#tinGradWalk)" stroke="#2b1a0b" stroke-width="2.2" />
  <rect x="45" y="78" width="30" height="36" rx="8" fill="url(#brassGradWalk)" opacity="0.92" stroke="#5a4212" stroke-width="1.4" />
  <circle cx="49" cy="83" r="1.3" fill="#3a2505" />
  <circle cx="71" cy="83" r="1.3" fill="#3a2505" />
  <circle cx="49" cy="109" r="1.3" fill="#3a2505" />
  <circle cx="71" cy="109" r="1.3" fill="#3a2505" />

  <!-- Head -->
  <circle cx="60" cy="45" r="26" fill="url(#tinGradWalk)" stroke="#2b1a0b" stroke-width="2.2" />
  <!-- Ears -->
  <circle cx="40" cy="24" r="10" fill="url(#tinGradWalk)" stroke="#2b1a0b" stroke-width="1.8" />
  <circle cx="40" cy="24" r="5" fill="url(#brassGradWalk)" />
  <circle cx="80" cy="24" r="10" fill="url(#tinGradWalk)" stroke="#2b1a0b" stroke-width="1.8" />
  <circle cx="80" cy="24" r="5" fill="url(#brassGradWalk)" />

  <!-- Face -->
  <circle cx="52" cy="40" r="4" fill="#150d06" />
  <circle cx="50.5" cy="38.5" r="1.2" fill="#fff" />
  <circle cx="68" cy="40" r="4" fill="#150d06" />
  <circle cx="66.5" cy="38.5" r="1.2" fill="#fff" />

  <ellipse cx="60" cy="50" rx="11" ry="8" fill="#d9b68b" stroke="#331e0c" stroke-width="1.3" />
  <polygon points="57,46 63,46 60,51" fill="#2b1a0b" />
  <path d="M 57 53 Q 60 56 63 53" fill="none" stroke="#2b1a0b" stroke-width="1.8" stroke-linecap="round" />

  <!-- Swinging Arms in Stride -->
  <path d="M 34 76 Q 18 90 24 105" fill="none" stroke="url(#tinGradWalk)" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 86 76 Q 102 90 96 105" fill="none" stroke="url(#tinGradWalk)" stroke-width="6.5" stroke-linecap="round" />
</svg>
