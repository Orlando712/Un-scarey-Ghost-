<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <radialGradient id="ghostGlowDroop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#ddebf2" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#b0cfdc" stop-opacity="0.38" />
    </radialGradient>
    <filter id="ghostShadowDroop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a0514" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#ghostShadowDroop)">
    <!-- Slumped Drooping Sheet Body (Wider Deflated Silhouette) -->
    <path d="
      M 70 24
      C 42 24, 24 58, 24 94
      C 24 122, 28 140, 30 146
      C 37 138, 47 150, 54 142
      C 62 150, 70 136, 78 146
      C 86 136, 94 150, 101 142
      C 108 150, 114 138, 117 146
      C 119 122, 116 58, 70 24 Z
    " fill="url(#ghostGlowDroop)" />

    <!-- Shy Pink Blush -->
    <ellipse cx="46" cy="94" rx="7" ry="4.5" fill="#ff7a98" opacity="0.8" />
    <ellipse cx="94" cy="94" rx="7" ry="4.5" fill="#ff7a98" opacity="0.8" />

    <!-- Sheepish Drooping Eyes Looking at Player (Fourth Wall Glance) -->
    <g>
      <!-- Eye whites/bases -->
      <ellipse cx="54" cy="80" rx="6" ry="6.5" fill="#140b1c" />
      <ellipse cx="86" cy="80" rx="6" ry="6.5" fill="#140b1c" />
      <!-- Heavy drooping eyelids -->
      <path d="M 47 78 Q 54 84 61 78 Z" fill="#d2e6f0" />
      <path d="M 79 78 Q 86 84 93 78 Z" fill="#d2e6f0" />
      <!-- Downward highlights -->
      <circle cx="53" cy="82" r="1.6" fill="#fff" />
      <circle cx="85" cy="82" r="1.6" fill="#fff" />
    </g>

    <!-- Sighing Awkward Wavy Mouth -->
    <path d="M 64 98 Q 67 101 70 98 Q 73 95 76 99" fill="none" stroke="#140b1c" stroke-width="2.2" stroke-linecap="round" />

    <!-- Limp Drooping Arms Hanging Down -->
    <path d="M 28 98 Q 24 116 32 126" fill="none" stroke="#c0dce8" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 112 98 Q 116 116 108 126" fill="none" stroke="#c0dce8" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
