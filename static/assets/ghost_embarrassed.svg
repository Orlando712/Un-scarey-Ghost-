<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <radialGradient id="ghostGlowEmb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#e2f1f8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#b8dce8" stop-opacity="0.4" />
    </radialGradient>
    <filter id="ghostShadowEmb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0a0514" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#ghostShadowEmb)">
    <!-- Sheet Body -->
    <path d="
      M 70 15
      C 38 15, 26 48, 26 84
      C 26 116, 30 138, 33 145
      C 40 138, 48 152, 55 142
      C 62 152, 70 135, 77 145
      C 84 135, 92 152, 99 142
      C 106 152, 112 138, 115 145
      C 117 116, 115 48, 70 15 Z
    " fill="url(#ghostGlowEmb)" />

    <!-- Big Pink Blush -->
    <ellipse cx="46" cy="84" rx="7" ry="5" fill="#ff708d" opacity="0.85" />
    <ellipse cx="94" cy="84" rx="7" ry="5" fill="#ff708d" opacity="0.85" />

    <!-- Shy Downward Eyes -->
    <g>
      <ellipse cx="54" cy="73" rx="4.5" ry="5.5" fill="#140b1c" />
      <ellipse cx="86" cy="73" rx="4.5" ry="5.5" fill="#140b1c" />
      <circle cx="53" cy="71" r="1.5" fill="#fff" />
      <circle cx="85" cy="71" r="1.5" fill="#fff" />
    </g>

    <!-- Nervous Wavy Mouth -->
    <path d="M 64 88 Q 67 92 70 88 Q 73 84 76 88" fill="none" stroke="#140b1c" stroke-width="2.2" stroke-linecap="round" />

    <!-- Shy Arms Held Inward -->
    <path d="M 32 90 Q 42 100 48 94" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 108 90 Q 98 100 92 94" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
