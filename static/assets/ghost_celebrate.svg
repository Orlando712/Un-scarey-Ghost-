<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <radialGradient id="ghostGlowCelebrate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="70%" stop-color="#e6f5fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#bce4f5" stop-opacity="0.5" />
    </radialGradient>
    <filter id="ghostShadowCelebrate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0a0514" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#ghostShadowCelebrate)">
    <!-- Buoyant Celebratory Sheet Body -->
    <path d="
      M 70 12
      C 36 12, 24 45, 24 82
      C 24 115, 28 138, 30 145
      C 38 136, 48 152, 56 140
      C 64 152, 70 134, 78 146
      C 86 134, 94 152, 102 140
      C 110 152, 114 136, 118 145
      C 120 115, 116 45, 70 12 Z
    " fill="url(#ghostGlowCelebrate)" />

    <!-- Joyful Rosy Cheeks -->
    <ellipse cx="46" cy="82" rx="7" ry="5" fill="#ff6b8b" opacity="0.85" />
    <ellipse cx="94" cy="82" rx="7" ry="5" fill="#ff6b8b" opacity="0.85" />

    <!-- Sparkling Golden Star Eyes -->
    <g transform="translate(52, 65)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#d4af37" />
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#fff59d" />
    </g>
    <g transform="translate(88, 65)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#d4af37" />
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#fff59d" />
    </g>

    <!-- Big Ecstatic Open Cheering Smile -->
    <path d="M 60 82 Q 70 98 80 82 Z" fill="#140b1c" />
    <path d="M 64 89 Q 70 95 76 89" fill="#ff7a98" />

    <!-- Triumphant Raised Cheering Arms -->
    <path d="M 28 78 Q 12 55 22 42" fill="none" stroke="#d5edf8" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 112 78 Q 128 55 118 42" fill="none" stroke="#d5edf8" stroke-width="5.5" stroke-linecap="round" />

    <!-- Little Golden Celebration Sparkles Around Head -->
    <polygon points="20,25 22,29 26,30 22,31 20,35 18,31 14,30 18,29" fill="#ffd54f" opacity="0.9" />
    <polygon points="120,22 122,25 125,26 122,27 120,30 118,27 115,26 118,25" fill="#ffd54f" opacity="0.9" />
    <polygon points="70,2 71,4 73,5 71,6 70,8 69,6 67,5 69,4" fill="#ffd54f" opacity="0.9" />
  </g>
</svg>
