<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <radialGradient id="ghostGlowNervous" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#e2f1f8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#b8dce8" stop-opacity="0.4" />
    </radialGradient>
    <filter id="ghostShadowNervous" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0a0514" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#ghostShadowNervous)">
    <!-- Sheet Body (Slightly Tilted in Hesitation) -->
    <path d="
      M 70 16
      C 40 16, 28 48, 28 84
      C 28 116, 32 138, 34 145
      C 41 138, 49 152, 56 142
      C 63 152, 71 135, 78 145
      C 85 135, 93 152, 100 142
      C 107 152, 113 138, 116 145
      C 118 116, 116 48, 70 16 Z
    " fill="url(#ghostGlowNervous)" />

    <!-- Nervous Rosy Cheeks -->
    <ellipse cx="48" cy="85" rx="6" ry="4" fill="#ff7a98" opacity="0.75" />
    <ellipse cx="92" cy="85" rx="6" ry="4" fill="#ff7a98" opacity="0.75" />

    <!-- Eyes Darting Nervously to the Right (Toward Approaching Barnaby!) -->
    <g>
      <ellipse cx="54" cy="71" rx="5.5" ry="6.5" fill="#140b1c" />
      <ellipse cx="86" cy="71" rx="5.5" ry="6.5" fill="#140b1c" />
      <!-- Pupils shifted rightward -->
      <circle cx="57" cy="70" r="2.2" fill="#fff" />
      <circle cx="89" cy="70" r="2.2" fill="#fff" />
    </g>

    <!-- Nervous Trembling Wavy Mouth -->
    <path d="M 64 88 Q 67 85 70 89 Q 73 93 76 88" fill="none" stroke="#140b1c" stroke-width="2.2" stroke-linecap="round" />

    <!-- Fidgeting Nervous Arms Clutched to Chest -->
    <path d="M 32 92 Q 48 98 58 92" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 108 92 Q 92 98 82 92" fill="none" stroke="#d0e7f2" stroke-width="4.5" stroke-linecap="round" />

    <!-- Comic Nervous Sweat Drop at Temple -->
    <path d="M 98 52 C 98 48, 104 42, 104 42 C 104 42, 110 48, 110 52 C 110 55.3, 107.3 58, 104 58 C 100.7 58, 98 55.3, 98 52 Z" fill="#64b5f6" opacity="0.9" />
  </g>
</svg>
